# CI/CD: main push → (optional infra) → proto gen → Kotlin/Flutter build → k3s-worker deploy
#
# 実行環境: k3s-worker（オンプレ単一ノード k3s）の namespace tagomori-status。
#   self-hosted ランナーから Tailscale 経由で k3s-worker に SSH し、
#   app.jar / Flutter Web を /opt/tagomori-status/releases/<sha> に rsync → deploy/k8s/deploy.sh で適用。
#   イメージレジストリは使わない（公式 temurin イメージ + hostPath）。
#
# Required GitHub Secrets:
#   K3S_SSH_KEY      : k3s-worker（shinari）への CI 専用 SSH 秘密鍵（sushiMCfront-ci-deploy）
#   K3S_KNOWN_HOSTS  : k3s-worker の ssh-keyscan 結果
#   DB_PASSWORD      : MariaDB の app ユーザーのパスワード。Secret tagomori-status-db に同期する。
#                      MariaDB 側のユーザーは初回起動時にしか作られないため、値を変えるときは
#                      DB 内で ALTER USER も合わせて行うこと。
#   PUBSUB_TOPIC     : Pub/Sub トピック名（projects/{project}/topics/{topic} 形式）。
#                      ログイン・更新ボタン押下時に Minecraft /list をトリガーする。
#                      未設定の場合は publish をスキップ（エラーにはならない）。
#
# 手動で一度だけ作成済みの Secret（CI は作成・上書きしない）:
#   cloudflared-token : Secret Manager tagomori-tunnel-token の TUNNEL_TOKEN
#   gcp-credentials   : minecraft/gcs-backup-credentials の key.json（Pub/Sub publish 用 ADC）
#
# Optional (Terraform job):
#   GCP_WIF_PROVIDER / GCP_SERVICE_ACCOUNT / GCP_PROJECT_ID

name: Deploy to k3s

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  K3S_HOST: 100.107.122.45   # k3s-worker の Tailscale IP
  K3S_USER: shinari
  RELEASES_DIR: /opt/tagomori-status/releases
  FLUTTER_VERSION: '3.44.2'

jobs:
  # ---- Optional: Terraform で infra/terraform/** 変更時のみ実行 ----
  infra:
    runs-on: self-hosted
    timeout-minutes: 15
    if: |
      contains(toJSON(github.event.commits.*.modified), 'infra/terraform') ||
      contains(toJSON(github.event.commits.*.added),    'infra/terraform')

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"

      - name: Write terraform.tfvars
        run: |
          cat > infra/terraform/terraform.tfvars <<EOF
          project_id = "${{ secrets.GCP_PROJECT_ID }}"
          EOF

      - run: terraform -chdir=infra/terraform init
      - run: terraform -chdir=infra/terraform plan  -out=tfplan
      - run: terraform -chdir=infra/terraform apply -auto-approve tfplan

  # ---- Build and deploy application ----
  build-and-deploy:
    runs-on: self-hosted
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y unzip curl git jq xz-utils rsync openssh-client

      # ---- Dart stubs (Kotlin は Gradle が自動生成) ----
      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # self-hosted ランナーのローカルディスクに Flutter を永続キャッシュ。
      # actions/cache と違い GitHub キャッシュサービスへの転送が不要なので、
      # 2回目以降は 5 秒以内で完了する。バージョンを変えるまで再ダウンロード不要。
      - name: Setup Flutter (runner-local cache)
        run: |
          FLUTTER_DIR="$HOME/.flutter-sdk/$FLUTTER_VERSION"
          if [ ! -f "$FLUTTER_DIR/bin/flutter" ]; then
            echo "Flutter $FLUTTER_VERSION not found — installing..."
            mkdir -p "$(dirname "$FLUTTER_DIR")"
            git clone --depth 1 -b "$FLUTTER_VERSION" \
              https://github.com/flutter/flutter.git "$FLUTTER_DIR"
          else
            echo "Flutter $FLUTTER_VERSION found in runner cache."
          fi
          echo "$FLUTTER_DIR/bin" >> "$GITHUB_PATH"

      - name: Generate Dart stubs from shared.proto
        run: |
          # 21.1.2: protobuf ^3.x 互換。25.x は ^4.x 用で pubspec と不一致になる。
          dart pub global activate protoc_plugin 21.1.2
          export PATH="$PATH:$HOME/.pub-cache/bin"
          mkdir -p frontend/lib/src/generated
          protoc \
            --proto_path=. \
            --dart_out=grpc:frontend/lib/src/generated \
            shared.proto

      # ---- Backend ----
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build fat JAR
        working-directory: backend
        run: ./gradlew --no-daemon shadowJar

      # ---- Frontend ----
      # --web-renderer は Flutter 3.29 で削除済み。付けないこと。
      - name: Build Flutter Web
        working-directory: frontend
        run: |
          flutter pub get
          flutter build web --release

      # ---- Bundle ----
      - name: Assemble release
        run: |
          rm -rf release && mkdir -p release/web
          cp backend/build/libs/*.jar  release/app.jar
          cp -r frontend/build/web/.   release/web/
          cp deploy/envoy.yaml         release/
          cp -r deploy/k8s             release/k8s

      - name: Configure SSH to k3s-worker
        env:
          K3S_SSH_KEY: ${{ secrets.K3S_SSH_KEY }}
          K3S_KNOWN_HOSTS: ${{ secrets.K3S_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh/tagomori-status
          printf '%s\n' "$K3S_SSH_KEY" > ~/.ssh/tagomori-status/key
          printf '%s\n' "$K3S_KNOWN_HOSTS" > ~/.ssh/tagomori-status/known_hosts
          chmod 600 ~/.ssh/tagomori-status/*
          echo "SSH_OPTS=-i $HOME/.ssh/tagomori-status/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/tagomori-status/known_hosts -o ConnectTimeout=15" >> "$GITHUB_ENV"

      # ---- 転送（rsync over SSH） ----
      - name: Transfer release to k3s-worker
        run: |
          rsync -a --delete -e "ssh $SSH_OPTS" release/ \
            "${K3S_USER}@${K3S_HOST}:${RELEASES_DIR}/${GITHUB_SHA}/"

      # ---- Secret 同期（値は stdin 経由で渡し、コマンドラインやログに出さない） ----
      - name: Sync app secret
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          PUBSUB_TOPIC: ${{ secrets.PUBSUB_TOPIC }}
        run: |
          {
            echo 'apiVersion: v1'
            echo 'kind: Secret'
            echo 'metadata:'
            echo '  name: tagomori-status-db'
            echo '  namespace: tagomori-status'
            echo 'data:'
            echo "  DB_PASSWORD: $(printf '%s' "$DB_PASSWORD" | base64 -w0)"
            if [ -n "$PUBSUB_TOPIC" ]; then
              echo "  PUBSUB_TOPIC: $(printf '%s' "$PUBSUB_TOPIC" | base64 -w0)"
            fi
          } | ssh $SSH_OPTS "${K3S_USER}@${K3S_HOST}" 'sudo kubectl apply -f -'

      # ---- 適用 + ロールアウト待ち ----
      - name: Deploy to k3s
        run: |
          ssh $SSH_OPTS "${K3S_USER}@${K3S_HOST}" \
            "sudo bash ${RELEASES_DIR}/${GITHUB_SHA}/k8s/deploy.sh ${GITHUB_SHA}"

      # ---- Cloudflare キャッシュパージ (オプション) ----
      # CF_API_TOKEN / CF_ZONE_ID を GitHub Secrets に設定すると有効になる。
      # 設定方法:
      #   CF_ZONE_ID    : Cloudflare Dashboard → ドメイン Overview → Zone ID
      #   CF_API_TOKEN  : My Profile → API Tokens → "Zone:Cache Purge" 権限のみ付与
      # 未設定の場合はこのステップをスキップする (if 条件で評価)。
      - name: Purge Cloudflare cache
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          if [ -z "${CF_API_TOKEN}" ]; then
            echo 'CF_API_TOKEN not set — skipping cache purge'
            exit 0
          fi
          curl -sf -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            && echo 'Cloudflare cache purged.' \
            || echo 'CF purge failed (non-fatal)'

      # ---- 起動確認 + ログ取得 ----
      - name: Verify deployment
        run: |
          ssh $SSH_OPTS "${K3S_USER}@${K3S_HOST}" '
            echo "========== pods =========="
            sudo kubectl -n tagomori-status get pods -o wide
            echo "========== api logs (last 40) =========="
            sudo kubectl -n tagomori-status logs deploy/api --tail=40 | grep -v " DEBUG "
            echo "========== cloudflared logs (last 10) =========="
            sudo kubectl -n tagomori-status logs deploy/cloudflared --tail=10
          '
          curl -sfo /dev/null -w 'HTTP %{http_code}  %{time_total}s  %{url_effective}\n' \
            https://app.tagomori.dev/

      - name: Remove SSH key
        if: always()
        run: rm -rf ~/.ssh/tagomori-status
