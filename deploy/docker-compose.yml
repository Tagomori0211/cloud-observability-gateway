# Runtime stack on mc-gateway: cloudflared + Envoy + Ktor + MariaDB
#
# mc-gateway は Minecraft-on-Kubernetes リポジトリ（Terraform/gateway.tf・gce/gateway/）が管理する
# 単体 VM（e2-micro）で、入口 socat・監視スタック（VictoriaMetrics 等）と同居する。
# ホストメトリクスは mc-gateway 側の node-exporter / VictoriaMetrics が収集するため、
# このスタックに node-exporter / vmagent は置かない。
#
# Prerequisites (manual, one-time):
#   - Cloudflare Zero Trust: create Tunnel, TUNNEL_TOKEN を Secret Manager
#     (tagomori-tunnel-token) に登録 → CI が ~/app/.env に展開
#   - CF Public Hostname: app.tagomori.dev → http://envoy:80
#
# TUNNEL_TOKEN は ~/app/.env から自動ロードされる（compose v2 の env_file デフォルト動作）。
# GCE ファイアウォール: 80/443/50051 の外部公開不要（CI は IAP SSH）。
#
# NOTE: networks: internal: true を追加しないこと。
#   cloudflared のアウトバウンド接続と、ホスト上の VictoriaMetrics への通信が塞がる。

services:
  # ---- Cloudflare Tunnel — sole external ingress ----
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: app-cloudflared
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - envoy
    restart: unless-stopped

  # ---- gRPC-Web conversion + routing ----
  envoy:
    image: envoyproxy/envoy:v1.31.5
    container_name: app-envoy
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      - api
    restart: unless-stopped
    # mc-gateway（e2-micro）で監視スタックと同居するため上限を設ける
    mem_limit: 64m
    # No ports: only reachable from cloudflared inside compose network.

  # ---- Kotlin (Ktor static + grpc-kotlin) ----
  api:
    build:
      context: ./api    # CI places app.jar + Dockerfile here
    container_name: app-api
    # 同じ VM（mc-gateway）のホストで待ち受ける VictoriaMetrics（host network :8428）へ到達するため
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # 値は ~/app/.env の VICTORIA_METRICS_URL から自動ロード（CI の既定値: http://host.docker.internal:8428）。
      VICTORIA_METRICS_URL: ${VICTORIA_METRICS_URL}
      DB_URL: ${DB_URL:-jdbc:mariadb://mariadb:3306/tagomori_status}
      DB_USER: ${DB_USER:-app}
      DB_PASSWORD: ${DB_PASSWORD:-tagomori_internal_db_pass}
      # projects/{project}/topics/{topic} 形式で設定。未設定時は publish をスキップ。
      PUBSUB_TOPIC: ${PUBSUB_TOPIC:-}
    volumes:
      # Flutter Web assets: rsync で更新、イメージ再ビルド不要。
      - ./web:/app/web:ro
    depends_on:
      - mariadb
    restart: unless-stopped
    # e2-micro(1GB) 向け: JVM をコンテナ単位で封じ込め、ホスト OOM を防ぐ。
    # 超過時は api コンテナのみ再起動（restart: unless-stopped）でホストは安全。
    # Dockerfile.api の -XX:MaxRAMPercentage=65.0 がこの 384m を基準にヒープを決定。
    mem_limit: 384m
    # No ports: 8080 and 50051 are compose-network-internal only.

  mariadb:
    image: mariadb:11.4
    container_name: app-mariadb
    # 小規模データ・e2-micro 同居向けのメモリ設定（既定では 100MB 超を常駐する）
    command:
      - "--innodb-buffer-pool-size=32M"
      - "--innodb-log-buffer-size=4M"
      - "--performance-schema=OFF"
      - "--max-connections=30"
      - "--key-buffer-size=1M"
      - "--table-open-cache=256"
      - "--thread-cache-size=4"
    mem_limit: 192m
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-tagomori_status}
      MARIADB_USER: ${MARIADB_USER:-app}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-tagomori_internal_db_pass}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-tagomori_internal_root_pass}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # ports は定義しない（compose ネットワーク内のみ）

volumes:
  mariadb-data:
