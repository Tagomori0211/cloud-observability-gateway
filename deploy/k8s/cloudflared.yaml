# Cloudflare Tunnel（app.tagomori.dev → http://envoy:80）。唯一の外部入口。
# TUNNEL_TOKEN は Secret cloudflared-token（Secret Manager tagomori-tunnel-token から作成）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: tagomori-status
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args: ["tunnel", "--no-autoupdate", "run"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-token
                  key: TUNNEL_TOKEN
          resources:
            limits:
              memory: 128Mi
