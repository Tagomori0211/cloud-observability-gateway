# gRPC-Web 変換 + ルーティング。設定は deploy/envoy.yaml をそのまま ConfigMap envoy-config にしたもの。
# __ENVOY_HASH__ は deploy.sh が envoy.yaml の sha256 に置換する（設定変更時のみ Pod を入れ替える）。
apiVersion: v1
kind: Service
metadata:
  name: envoy
  namespace: tagomori-status
spec:
  selector:
    app: envoy
  ports:
    - name: http
      port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy
  namespace: tagomori-status
spec:
  replicas: 1
  selector:
    matchLabels:
      app: envoy
  template:
    metadata:
      labels:
        app: envoy
      annotations:
        tagomori.dev/envoy-config-hash: "__ENVOY_HASH__"
    spec:
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.31.5
          ports:
            - name: http
              containerPort: 80
          resources:
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/envoy
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: envoy-config
